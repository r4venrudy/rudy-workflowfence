name: Unprivileged review
on: pull_request
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: printf '%s\n' "$PR_TITLE"
        env:
          PR_TITLE: "${{ github.event.pull_request.title }}"
